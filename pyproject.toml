[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pyagents"
version = "0.1.0"
description = "A minimal typed local/distributed programming model for agents"
requires-python = ">=3.11"
dependencies = ["pydantic>=2.6,<3"]

[project.optional-dependencies]
dev = [
    "mypy>=1.13",
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "ruff>=0.8",
]

[project.scripts]
pyagents-demo = "pyagents.demo:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
pyagents = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.mypy]
python_version = "3.11"
strict = true
